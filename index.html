<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SJM — Under Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#052A4D;
    --navy:#0068B3;
    --cyan:#1BB7EA;
    --cyan-soft:#7FDCF6;
    --ice:#EAF7FE;
    --white:#FFFFFF;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    overflow-x:hidden;
  }

  body{
    font-family:'Inter', sans-serif;
    background:radial-gradient(ellipse 120% 80% at 50% -10%, #0A3D6B 0%, var(--navy-deep) 55%, #031A32 100%);
    color:var(--ice);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:32px 20px 0;
  }

  /* ambient drifting glow */
  .glow{
    position:fixed;
    width:60vw; height:60vw;
    max-width:700px; max-height:700px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(27,183,234,0.18) 0%, rgba(27,183,234,0) 70%);
    top:-10%; left:50%;
    transform:translateX(-50%);
    pointer-events:none;
    z-index:0;
    animation:pulseGlow 6s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{opacity:0.7; transform:translateX(-50%) scale(1);}
    50%{opacity:1; transform:translateX(-50%) scale(1.08);}
  }

  main{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:640px;
    width:100%;
  }

  .logo-wrap{
    width:min(280px, 60vw);
    margin-bottom:18px;
    filter:drop-shadow(0 10px 30px rgba(27,183,234,0.25));
    animation:floatLogo 5s ease-in-out infinite;
  }
  .logo-wrap img{ width:100%; display:block; }

  @keyframes floatLogo{
    0%,100%{ transform:translateY(0px); }
    50%{ transform:translateY(-8px); }
  }

  .eyebrow{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--cyan-soft);
    margin-bottom:14px;
    opacity:0;
    animation:riseIn .7s ease .1s forwards;
  }

  .headline{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 6vw, 46px);
    line-height:1.15;
    color:var(--white);
    margin-bottom:16px;
    opacity:0;
    animation:riseIn .7s ease .25s forwards;
  }
  .headline span{ color:var(--cyan); }

  .sub{
    font-size:15.5px;
    line-height:1.65;
    color:#BFE3F5;
    max-width:460px;
    margin-bottom:140px;
    opacity:0;
    animation:riseIn .7s ease .4s forwards;
  }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* wave signature */
  .wave-stage{
    position:fixed;
    left:0; right:0; bottom:0;
    height:34vh;
    min-height:180px;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
  }
  .wave-stage svg{
    position:absolute;
    bottom:0; left:0;
    width:200%; height:100%;
  }
  .wave-back{ animation:driftWave 22s linear infinite; opacity:.55; }
  .wave-mid{ animation:driftWave 15s linear infinite reverse; opacity:.75; }
  .wave-front{ animation:driftWave 10s linear infinite; opacity:.95; }

  @keyframes driftWave{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }

  footer{
    position:relative;
    z-index:2;
    font-size:12px;
    color:#5C87A8;
    padding:18px 0 22px;
    letter-spacing:.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .logo-wrap, .glow, .wave-back, .wave-mid, .wave-front, .headline, .sub, .eyebrow, .cta, .socials{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
  }
</style>
</head>
